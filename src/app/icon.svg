<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="100%" stop-color="#080314"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a164d"/>
      <stop offset="100%" stop-color="#14092b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff2a8"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base with subtle glow border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#ffd700" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Mystic Tarot Card Body -->
  <rect x="15" y="8" width="34" height="48" rx="4" fill="url(#cardGrad)" stroke="url(#goldGrad)" stroke-width="1.5"/>

  <!-- Inner Ornate Card Border -->
  <rect x="18" y="11" width="28" height="42" rx="2.5" fill="none" stroke="#ffd700" stroke-width="0.75" stroke-opacity="0.6"/>

  <!-- Star Glow Halo -->
  <circle cx="32" cy="32" r="14" fill="url(#starGlow)"/>

  <!-- 8-Pointed Celestial Tarot Star -->
  <!-- Primary 4 Points -->
  <path d="M32 19 L34.5 29.5 L45 32 L34.5 34.5 L32 45 L29.5 34.5 L19 32 L29.5 29.5 Z" fill="url(#goldGrad)"/>
  
  <!-- Secondary 4 Diagonal Points -->
  <path d="M32 24 L33.8 30.2 L40 26 L35.8 32 L40 38 L33.8 33.8 L32 40 L30.2 33.8 L24 38 L28.2 32 L24 26 L30.2 30.2 Z" fill="#ffd700" fill-opacity="0.85"/>

  <!-- Brilliant Center Star Pearl -->
  <circle cx="32" cy="32" r="2.2" fill="#ffffff"/>

  <!-- Top & Bottom Celestial Ornaments -->
  <circle cx="32" cy="14.5" r="1.2" fill="#ffd700"/>
  <circle cx="32" cy="49.5" r="1.2" fill="#ffd700"/>
  <circle cx="21.5" cy="14.5" r="0.8" fill="#ffd700" opacity="0.7"/>
  <circle cx="42.5" cy="14.5" r="0.8" fill="#ffd700" opacity="0.7"/>
  <circle cx="21.5" cy="49.5" r="0.8" fill="#ffd700" opacity="0.7"/>
  <circle cx="42.5" cy="49.5" r="0.8" fill="#ffd700" opacity="0.7"/>
</svg>
