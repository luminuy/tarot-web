name: 🧠 Probe Cerebras — วัดว่ารับผังไพ่ใหญ่ไหวไหม (กดรันเอง)
run-name: "🧠 [By: ${{ github.actor }}] probe Cerebras · ผัง ${{ inputs.spreads || '1,5,10,12' }}"

# ⚠️ **กดรันเองเท่านั้น — ห้ามเพิ่ม trigger อื่นเด็ดขาด** (กติกาเดียวกับ ai-judge.yml)
# ------------------------------------------------------------------------------
# workflow นี้ยิงเข้าโมเดลจริง จึงกิน "โควตาฟรีต่อวัน" ของ Cerebras
# ซึ่งเป็นโควตาเดียวกับที่ผู้ใช้จริงบน production ใช้อยู่ (uncached 1M โทเค็น/วัน ≈ 42 ผังใหญ่)
# ถ้าผูกเข้า CI ให้รันทุก PR โควตาจะหมดก่อนที่ผู้ใช้จริงจะได้ใช้
#
# ⛔ ห้ามเพิ่ม `on: push` / `on: pull_request` / `on: schedule` ที่นี่
#
# ทำไมถึงรันบน GitHub แทนเครื่องตัวเอง: คีย์อยู่ใน repository secrets อยู่แล้ว
# ไม่ต้องส่งคีย์ให้ใครหรือวางลงแชทที่ไหน — ปลอดภัยกว่าและใครในทีมก็กดได้

on:
  workflow_dispatch:
    inputs:
      spreads:
        description: "ขนาดผังที่จะทดสอบ คั่นด้วยจุลภาค (1 = กลุ่มควบคุม · 12 = หนักสุด)"
        required: false
        default: "1,5,10,12"
      delay:
        description: "คูลดาวน์ระหว่างคำขอ (มิลลิวินาที) — ชั้นฟรีมีแค่ 5 คำขอ/นาที"
        required: false
        default: "13000"
      model:
        description: "เจาะจงโมเดลเดียว (เว้นว่าง = ทุกตัวฟรี · ใส่ qwen-3.8-27b = 💸 คิดเงิน)"
        required: false
        default: ""

concurrency:
  group: ai-probe-cerebras
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    name: 🧠 ยิง prompt ผังจริงเข้า Cerebras แล้วสรุปผล
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: ⚡ Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # ⚠️ ต้องปิดไว้เสมอ — repo นี้ไม่มี `pnpm-lock.yaml` ถ้าเปิดแคชจะล้มทันที
          package-manager-cache: false

      - name: 📦 Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🔑 ตรวจว่ามีคีย์ก่อนยิง
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          if [ -z "$CEREBRAS_API_KEY" ]; then
            echo "::error title=ไม่พบ CEREBRAS_API_KEY::ยังไม่ได้ตั้ง secret"
            {
              echo "### ❌ ยังไม่ได้ตั้ง \`CEREBRAS_API_KEY\`"
              echo ""
              echo "1. สร้างคีย์ฟรีที่ https://cloud.cerebras.ai (ไม่ต้องผูกบัตร)"
              echo "2. เอามาใส่ที่ **Settings ➔ Secrets and variables ➔ Actions ➔ New repository secret**"
              echo "3. ตั้งชื่อว่า \`CEREBRAS_API_KEY\` แล้วกดรัน workflow นี้ใหม่"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ พบคีย์แล้ว เริ่มยิงได้"

      - name: 🧠 ยิง probe ด้วย prompt ผังจริง
        id: probe
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          # 💸 ส่งต่อธงเปิดโมเดลที่คิดเงิน — ไม่ตั้ง = ยิงเฉพาะตัวฟรี
          CEREBRAS_ALLOW_PAID: ${{ secrets.CEREBRAS_ALLOW_PAID || vars.CEREBRAS_ALLOW_PAID || '' }}
        run: |
          set -o pipefail
          ARGS="--spreads ${{ inputs.spreads || '1,5,10,12' }} --delay ${{ inputs.delay || '13000' }}"
          if [ -n "${{ inputs.model }}" ]; then
            ARGS="$ARGS --model ${{ inputs.model }}"
          fi
          echo "รันด้วย: $ARGS"
          pnpm exec tsx scripts/qa/probe-cerebras.ts $ARGS 2>&1 | tee /tmp/probe-out.txt

      # รายงานขึ้นหน้าสรุปเสมอ แม้ probe จะตก — ผลที่ตกก็เป็นคำตอบที่เราต้องการเหมือนกัน
      - name: 📊 สรุปผลขึ้นหน้า Summary
        if: always()
        run: |
          {
            echo "## 🧠 ผลวัด Cerebras กับ prompt ผังจริง"
            echo ""
            echo '```'
            cat /tmp/probe-out.txt 2>/dev/null || echo "(ไม่มีผลลัพธ์ — ดูขั้นตอนก่อนหน้า)"
            echo '```'
            echo ""
            echo "### อ่านผลยังไง"
            echo ""
            echo "- **Schema ❌** = คำอ่านโดนตัดกลาง หรือไพ่ไม่ครบ ➔ ยังเปิดใช้ไม่ได้"
            echo "- **ต่างด้าว > 0** = มีอักษรจีน/ต่างด้าวหลุดปนภาษาไทย ➔ ต้องดูว่าด่านกวาดทันไหม"
            echo "- **ไทย** = คะแนนจาก \`checkThaiQualityDeep()\` เต็ม 100"
            echo ""
            echo "> ⚠️ **เกณฑ์ตัดสินว่าควรเปิดใช้หรือไม่**: ต้องเอาคะแนนไทยนี้ไปเทียบกับ Gemini"
            echo "> ซึ่งเป็นตัวที่รับผังใหญ่อยู่ตอนนี้ — **ถ้าแพ้ Gemini ก็ไม่ต้องเปิดเส้นทางนี้เลย**"
            echo "> การมีโค้ดพร้อมใช้ไม่ได้แปลว่าต้องใช้"
          } >> "$GITHUB_STEP_SUMMARY"
