name: 🚀 Production Deploy to Cloudflare Workers
run-name: "🚀 [By: ${{ github.actor }} | Branch: ${{ github.ref_name }}] ${{ github.event.head_commit.message || 'Deploy to Cloudflare Workers' }}"

on:
  push:
    branches:
      - main
  # จำเป็นต้องมี! GitHub จะไม่ trigger workflow จาก event ที่เกิดจาก GITHUB_TOKEN
  # (กันการวนซ้ำไม่รู้จบ) ดังนั้น PR ที่ถูก merge โดย pr.yml จะไม่ทำให้ deploy ทำงาน
  # pr.yml จึงต้องสั่ง dispatch มาที่นี่เองหลัง merge สำเร็จ
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  quality-check:
    name: 🧪 Quality & Integrity Checks
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: ⚡ Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # ⚠️ ต้องปิดไว้เสมอ — setup-node@v5 เปิดแคชของ package manager ให้เองโดยอัตโนมัติ
          # (v4 ไม่เปิดถ้าไม่ได้ใส่ `cache:`) มันอ่าน `packageManager: pnpm@9.15.4` ใน package.json
          # แล้วมองหา `pnpm-lock.yaml` ซึ่ง repo นี้ไม่มี (ใช้ `pnpm install --no-frozen-lockfile`)
          # ผลคือ workflow ล้มทันทีด้วย "Dependencies lock file is not found" (บทเรียน INC หลัง PR #234)
          package-manager-cache: false

      - name: 📦 Install dependencies
        run: pnpm install --no-frozen-lockfile

      # ชุดตรวจกลาง 6 ด่าน — นิยามอยู่ที่ CHECKS ใน scripts/github-auto.ts
      # เพิ่มด่านตรวจใหม่ที่นั่นที่เดียว ทั้ง hooks / PR / Deploy จะตรวจเหมือนกันหมด
      - name: 🧪 Verification Suite (6 ด่าน)
        run: pnpm run repo:verify
        # ⚠️ ต้องมีที่นี่ด้วย ไม่ใช่แค่ตอน deploy — `repo:verify` มีด่านที่ build เว็บเองเมื่อยังไม่มี
        # `.next/` (test-en-routing.ts) แล้วด่านภาพแชร์ (test-og-images.ts) ก็อ่านผลนั้นต่อ
        # `NEXT_PUBLIC_*` ถูกฝังตอน build เท่านั้น ถ้าขั้นนี้ build โดยไม่มีค่าเดียวกับตอน deploy
        # CI จะไปตรวจอาร์ติแฟกต์คนละก้อนกับที่ขึ้น production
        # (เกิดขึ้นจริงหลัง PR #348 — deploy ของ main ล้มด้วย "พบ 1 ค่า")
        env:
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID || vars.NEXT_PUBLIC_GA_ID || '' }}
          NEXT_PUBLIC_META_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_META_PIXEL_ID || vars.NEXT_PUBLIC_META_PIXEL_ID || '' }}
          NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT: ${{ secrets.NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT || vars.NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT || '' }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME || vars.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME || '' }}

  deploy:
    name: ⚡ Deploy to Cloudflare Workers
    needs: quality-check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: ⚡ Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # ⚠️ ต้องปิดไว้เสมอ — setup-node@v5 เปิดแคชของ package manager ให้เองโดยอัตโนมัติ
          # (v4 ไม่เปิดถ้าไม่ได้ใส่ `cache:`) มันอ่าน `packageManager: pnpm@9.15.4` ใน package.json
          # แล้วมองหา `pnpm-lock.yaml` ซึ่ง repo นี้ไม่มี (ใช้ `pnpm install --no-frozen-lockfile`)
          # ผลคือ workflow ล้มทันทีด้วย "Dependencies lock file is not found" (บทเรียน INC หลัง PR #234)
          package-manager-cache: false

      - name: 📦 Install dependencies
        run: pnpm install --no-frozen-lockfile

      # รัน migration ที่ยังไม่ apply ทั้งหมดใส่ D1 remote ก่อน deploy โค้ดใหม่ขึ้นไป
      # (idempotent — wrangler เช็ก migration ที่ apply แล้วจาก D1_migrations table เอง ข้ามอันที่ทำไปแล้วอัตโนมัติ)
      # ⚠️ CLOUDFLARE_API_TOKEN ต้องมีสิทธิ์ D1:Edit ด้วย ไม่งั้นขั้นนี้จะ fail แบบระบุชัดว่าขาดสิทธิ์อะไร
      - name: 🗄️ Apply D1 Migrations (remote)
        run: pnpm run db:migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ── รายงานค่าวัดผลที่ยังไม่ได้ตั้ง (ไม่ทำให้ deploy ล้ม) ──────────────────
      # ที่มา: Meta Pixel ไม่ทำงานบน production มานาน โดยไม่มีอะไรบอกเลยสักที่
      # เพราะ `NEXT_PUBLIC_*` ที่ว่างจะถูกฝังเป็นสตริงว่างตอน build อย่างเงียบสนิท
      # แล้วโค้ดก็ตกไปใช้ `/api/config/analytics` ตอน runtime ต่อ — พังแบบไม่มีเสียง
      #
      # ⚠️ ตั้งใจให้ "เตือน" ไม่ให้ "ล้ม" — ค่าพวกนี้เป็น secret ที่มีแต่เจ้าของตั้งได้
      #    ถ้าปล่อยให้ deploy ล้ม เว็บจะขึ้นไม่ได้เลยเพราะเรื่องที่ไม่เกี่ยวกับโค้ด
      - name: 📊 ตรวจว่าตั้งค่าวัดผลครบไหม (เตือนอย่างเดียว ไม่ทำให้ล้ม)
        env:
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID || vars.NEXT_PUBLIC_GA_ID || '' }}
          NEXT_PUBLIC_META_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_META_PIXEL_ID || vars.NEXT_PUBLIC_META_PIXEL_ID || '' }}
          NEXT_PUBLIC_GOOGLE_ADS_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_ADS_ID || vars.NEXT_PUBLIC_GOOGLE_ADS_ID || '' }}
        run: |
          missing=""
          for name in NEXT_PUBLIC_GA_ID NEXT_PUBLIC_META_PIXEL_ID NEXT_PUBLIC_GOOGLE_ADS_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::warning title=ค่าวัดผลยังไม่ได้ตั้งใน GitHub::ค่าที่ยังว่าง:$missing"
            {
              echo "### ⚠️ ค่าวัดผลที่ยังไม่ได้ตั้งใน GitHub"
              echo ""
              for name in $missing; do echo "- \`$name\`"; done
              echo ""
              echo "ค่าเหล่านี้ถูกฝังตอน build เท่านั้น ปล่อยว่างไว้ = สคริปต์วัดผลไม่ถูกใส่ลงหน้าเว็บตั้งแต่ต้น"
              echo "ตั้งได้ที่ **Settings ➔ Secrets and variables ➔ Actions** (ใส่เป็น secret หรือ variable ก็ได้)"
              echo ""
              echo "> หมายเหตุ: เว็บยังมีทางสำรองอ่านค่าตอน runtime จาก \`/api/config/analytics\`"
              echo "> ซึ่งอ่าน env ของ Cloudflare Worker — ถ้าตั้งไว้ฝั่ง Worker แล้วตัวนั้นจะทำงานแทน"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ ตั้งค่าวัดผลครบทุกตัว"
          fi

      # `pnpm run deploy` = opennextjs-cloudflare build && opennextjs-cloudflare deploy
      # ขั้น deploy จะ populateCache: seed หน้า SSG ทั้งหมดลง KV ก่อน `wrangler deploy`
      # ⚠️ CLOUDFLARE_API_TOKEN ต้องมี Workers Scripts:Edit + Workers KV Storage:Edit
      #    ถ้าขาด ขั้น populateCache จะ fail แบบระบุชัดว่าขาดสิทธิ์อะไร
      - name: 🚀 Build & Deploy to Cloudflare Workers
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID || vars.NEXT_PUBLIC_GA_ID || '' }}
          NEXT_PUBLIC_META_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_META_PIXEL_ID || vars.NEXT_PUBLIC_META_PIXEL_ID || '' }}
          NEXT_PUBLIC_GOOGLE_ADS_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_ADS_ID || vars.NEXT_PUBLIC_GOOGLE_ADS_ID || '' }}
          NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_LABEL: ${{ secrets.NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_LABEL || vars.NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_LABEL || '' }}
          NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT: ${{ secrets.NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT || vars.NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT || '' }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME || vars.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME || '' }}



      # ── ล้างแคช Edge หลัง deploy (จำเป็นตั้งแต่เปิด Cache Rules เฟส 1) ──────────
      # Cache Rule `[phase1]` ตั้ง edge TTL หน้า SSG ไว้ 7 วัน ถ้าไม่ purge หลังปล่อยเวอร์ชันใหม่
      # ผู้ใช้จะยังเห็นหน้าเดิมค้างอยู่นานถึง 7 วัน (ของใหม่ขึ้นแล้วแต่ไม่มีใครเห็น)
      #
      # ⚠️ ขั้นนี้วางไว้ "หลัง" deploy เสมอ — ถ้า token ขาดสิทธิ์ "Zone · Cache Purge · Purge"
      #    โค้ดใหม่จะขึ้น production เรียบร้อยแล้ว เหลือแค่ job ขึ้นสีแดงเตือนให้ไปเติมสิทธิ์
      #    (เลือกให้ fail ดัง ๆ ดีกว่าปล่อยผ่านเงียบ ๆ แล้วเว็บค้างของเก่าโดยไม่มีใครรู้ — INC กันไว้ก่อน)
      - name: 🧹 Purge Cloudflare Edge Cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "::error::ไม่พบ secret CLOUDFLARE_ZONE_ID — เพิ่มที่ Settings ➔ Secrets ➔ Actions"
            echo "::error::หา zone id ได้ที่ Cloudflare Dashboard ➔ seertarot.net ➔ Overview (คอลัมน์ขวา)"
            exit 1
          fi

          RESPONSE=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')

          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q '"success":true'; then
            echo "✅ ล้างแคช Edge สำเร็จ — ผู้ใช้จะเห็นเวอร์ชันใหม่ทันที"
          else
            echo "::error::ล้างแคชไม่สำเร็จ — โค้ดใหม่ขึ้น production แล้ว แต่ Edge ยังเสิร์ฟของเก่าอยู่"
            echo "::error::เติมสิทธิ์ 'Zone · Cache Purge · Purge' ให้ CLOUDFLARE_API_TOKEN แล้ว re-run job นี้"
            exit 1
          fi
