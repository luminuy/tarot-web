name: 🚀 Production Deploy to Cloudflare Workers
run-name: "🚀 [By: ${{ github.actor }} | Branch: ${{ github.ref_name }}] ${{ github.event.head_commit.message || 'Deploy to Cloudflare Workers' }}"

on:
  push:
    branches:
      - main
  # จำเป็นต้องมี! GitHub จะไม่ trigger workflow จาก event ที่เกิดจาก GITHUB_TOKEN
  # (กันการวนซ้ำไม่รู้จบ) ดังนั้น PR ที่ถูก merge โดย pr.yml จะไม่ทำให้ deploy ทำงาน
  # pr.yml จึงต้องสั่ง dispatch มาที่นี่เองหลัง merge สำเร็จ
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

# 🔒 R-17: สิทธิ์แคบที่สุดเท่าที่งานนี้ใช้จริง — แค่อ่านโค้ดมา build แล้วส่งขึ้น Cloudflare
# ไม่เขียนอะไรกลับเข้ารีโปเลยสักบรรทัด (การออกแท็ก/รีลีสเป็นหน้าที่ของ auto-release.yml)
permissions:
  contents: read

jobs:
  quality-check:
    name: 🧪 Quality & Integrity Checks
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # ⚠️ R-15: ต้องมี **ประวัติ git ครบ** ไม่ใช่ shallow clone
          # `test-judge-baseline.ts` เทียบ `PROMPT_VERSION` กับ `origin/main` เพื่อบังคับกฎ
          # "ขึ้นเวอร์ชัน prompt แล้วต้องแนบผลวัด" — หา ref ไม่เจอเมื่อไหร่ ด่านนั้นเสื่อมเป็น
          # no-op เงียบ ๆ ทันที (ตรงกับที่ `pr.yml` ตั้งไว้อยู่แล้ว)
          fetch-depth: 0

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      # 🔒 R-13: ติดตั้งด้วย `npm ci` ซึ่ง **บังคับ `package-lock.json`** ที่ commit ไว้
      # ---------------------------------------------------------------------------
      # ของเดิมเป็น `pnpm install --no-frozen-lockfile` ทั้งที่รีโปนี้ไม่มี `pnpm-lock.yaml` เลย
      # ทุกครั้งที่ CI รันจึงแก้กราฟ dependency ใหม่จากศูนย์ และอาจดึงเวอร์ชัน transitive
      # คนละชุดกับที่ทดสอบในเครื่อง — ใน job ที่ถือ `CLOUDFLARE_API_TOKEN` และคีย์ AI
      # `npm ci` ล้มทันทีถ้า lockfile ไม่ตรงกับ package.json ซึ่งเป็นสิ่งที่เราต้องการ
      # และแคชของ setup-node ใช้ได้เลยเพราะ `package-lock.json` มีอยู่จริง (กับดักเดิมหายไปเอง)
      - name: 📦 Install dependencies
        run: npm ci

      # ⚠️ **build ต้องอยู่ก่อน repo:verify เสมอ** (บทเรียน R-06)
      # ของเดิมรันชุดตรวจก่อน ด่านที่ตรวจไฟล์จากการ build จึงไปตรวจของที่ยังไม่มี
      # มี 3 ด่านที่เอาตัวรอดด้วยการสั่ง build เอง ที่เหลือข้ามเงียบแล้วรายงานผ่าน
      - name: ⚡ Build Worker & Next.js Bundle (ต้องมาก่อนชุดตรวจ)
        run: npm run build
        env:
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID || vars.NEXT_PUBLIC_GA_ID || '' }}
          NEXT_PUBLIC_META_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_META_PIXEL_ID || vars.NEXT_PUBLIC_META_PIXEL_ID || '' }}
          NEXT_PUBLIC_GOOGLE_ADS_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_ADS_ID || vars.NEXT_PUBLIC_GOOGLE_ADS_ID || '' }}
          NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_LABEL: ${{ secrets.NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_LABEL || vars.NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_LABEL || '' }}
          NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT: ${{ secrets.NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT || vars.NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT || '' }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME || vars.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME || '' }}

      # ชุดตรวจกลาง — นิยามอยู่ที่ CHECKS ใน scripts/github-auto.ts
      # เพิ่มด่านตรวจใหม่ที่นั่นที่เดียว ทั้ง hooks / PR / Deploy จะตรวจเหมือนกันหมด
      - name: 🧪 Verification Suite
        run: npm run repo:verify
        # env ต้องตรงกับขั้น build เป๊ะ — `NEXT_PUBLIC_*` ถูกฝังตอน build เท่านั้น
        # (บทเรียน PR #348 — deploy ของ main ล้มด้วย "พบ 1 ค่า")
        env:
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID || vars.NEXT_PUBLIC_GA_ID || '' }}
          NEXT_PUBLIC_META_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_META_PIXEL_ID || vars.NEXT_PUBLIC_META_PIXEL_ID || '' }}
          NEXT_PUBLIC_GOOGLE_ADS_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_ADS_ID || vars.NEXT_PUBLIC_GOOGLE_ADS_ID || '' }}
          NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_LABEL: ${{ secrets.NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_LABEL || vars.NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_LABEL || '' }}
          NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT: ${{ secrets.NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT || vars.NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT || '' }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME || vars.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME || '' }}

  deploy:
    name: ⚡ Deploy to Cloudflare Workers
    needs: quality-check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      # 🔒 R-13: ติดตั้งด้วย `npm ci` ซึ่ง **บังคับ `package-lock.json`** ที่ commit ไว้
      # ---------------------------------------------------------------------------
      # ของเดิมเป็น `pnpm install --no-frozen-lockfile` ทั้งที่รีโปนี้ไม่มี `pnpm-lock.yaml` เลย
      # ทุกครั้งที่ CI รันจึงแก้กราฟ dependency ใหม่จากศูนย์ และอาจดึงเวอร์ชัน transitive
      # คนละชุดกับที่ทดสอบในเครื่อง — ใน job ที่ถือ `CLOUDFLARE_API_TOKEN` และคีย์ AI
      # `npm ci` ล้มทันทีถ้า lockfile ไม่ตรงกับ package.json ซึ่งเป็นสิ่งที่เราต้องการ
      # และแคชของ setup-node ใช้ได้เลยเพราะ `package-lock.json` มีอยู่จริง (กับดักเดิมหายไปเอง)
      - name: 📦 Install dependencies
        run: npm ci

      # รัน migration ที่ยังไม่ apply ทั้งหมดใส่ D1 remote ก่อน deploy โค้ดใหม่ขึ้นไป
      # (idempotent — wrangler เช็ก migration ที่ apply แล้วจาก D1_migrations table เอง ข้ามอันที่ทำไปแล้วอัตโนมัติ)
      # ⚠️ CLOUDFLARE_API_TOKEN ต้องมีสิทธิ์ D1:Edit ด้วย ไม่งั้นขั้นนี้จะ fail แบบระบุชัดว่าขาดสิทธิ์อะไร
      - name: 🗄️ Apply D1 Migrations (remote)
        run: npm run db:migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ── รายงานค่าวัดผลที่ "ใช้งานอยู่" แต่ยังไม่ได้ตั้ง (ไม่ทำให้ deploy ล้ม) ──────
      # ⚠️ ตรวจเฉพาะตัวที่ประกาศว่า "ใช้อยู่" เท่านั้น — ตัวที่ตั้งใจยังไม่ใช้ (Meta Pixel /
      #    Google Ads) ต้องไม่ขึ้นเตือน ไม่งั้นทุก deploy จะมีคำเตือนค้างถาวรจนไม่มีใครอ่าน
      #    ตรงกับที่ `AnalyticsTracker.tsx` เขียนไว้ว่า "เว็บนี้ตั้งแค่ GA4"
      #
      # 📌 วันไหนเริ่มใช้ Meta Pixel / Google Ads จริง ให้ย้ายชื่อจาก UNUSED มาไว้ที่ IN_USE
      #    **และต้องตั้งเป็น secret/variable ของ GitHub เท่านั้น** — ตั้งด้วย `wrangler secret`
      #    อย่างเดียวจะไม่ถูกหยิบมาใช้ เพราะเมื่อ `NEXT_PUBLIC_GA_ID` ติดมากับ build แล้ว
      #    `AnalyticsTracker` จะไม่ยิง `/api/config/analytics` อีกเลย (เงื่อนไข `||` ตัดตั้งแต่ต้น)
      - name: 📊 ตรวจว่าตั้งค่าวัดผลที่ใช้อยู่ครบไหม (เตือนอย่างเดียว ไม่ทำให้ล้ม)
        env:
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID || vars.NEXT_PUBLIC_GA_ID || '' }}
        run: |
          IN_USE="NEXT_PUBLIC_GA_ID"
          UNUSED="NEXT_PUBLIC_META_PIXEL_ID NEXT_PUBLIC_GOOGLE_ADS_ID"

          missing=""
          for name in $IN_USE; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done

          if [ -n "$missing" ]; then
            echo "::warning title=ค่าวัดผลที่ใช้อยู่ยังไม่ได้ตั้ง::ค่าที่ยังว่าง:$missing"
            {
              echo "### ⚠️ ค่าวัดผลที่ใช้อยู่แต่ยังไม่ได้ตั้งใน GitHub"
              echo ""
              for name in $missing; do echo "- \`$name\`"; done
              echo ""
              echo "ค่าเหล่านี้ถูกฝังตอน build เท่านั้น ปล่อยว่างไว้ = สคริปต์วัดผลไม่ถูกใส่ลงหน้าเว็บตั้งแต่ต้น"
              echo "ตั้งที่ **Settings ➔ Secrets and variables ➔ Actions** (ใส่เป็น secret หรือ variable ก็ได้)"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ ค่าวัดผลที่ใช้อยู่ตั้งครบแล้ว ($IN_USE)"
          fi

          echo "ℹ️  ยังไม่ได้ใช้งานโดยตั้งใจ (ไม่ถือว่าขาด):$UNUSED"

      # ── 📌 จดเวอร์ชันของ Worker ที่ใช้อยู่ "ก่อน" deploy (A10-02 · กฎถาวร INC-0285) ──────
      # ใช้เป็นปลายทางถอยอัตโนมัติถ้าขั้นยืนยันหลัง deploy ไม่ผ่าน
      # ⚠️ ต้องจด version id เจาะจง ห้ามถอยแบบเว้นว่าง — ขั้น Stripe `secret put` ด้านล่างสร้างเวอร์ชันใหม่ที่ใช้โค้ดชุดเดียวกัน
      #    ถอยแบบเว้นว่างจึงอาจถอยไปหาโค้ดชุดที่พังเอง (กับดักที่ INC-0285 บันทึกไว้)
      # อ่านไม่ได้ (เช่น deploy ครั้งแรกสุด) = ไม่ถอยอัตโนมัติ แต่ขั้นยืนยันยังทำให้ job แดงเตือนเหมือนเดิม
      - name: 📌 จดเวอร์ชัน Worker ที่ใช้อยู่ก่อน deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          raw="$(npx wrangler deployments list --json 2>/dev/null)"
          prev="$(printf '%s' "$raw" | sed -n '/^\[/,$p' | jq -r 'sort_by(.created_on) | last | .versions | max_by(.percentage) | .version_id' 2>/dev/null)"
          if [ -n "$prev" ] && [ "$prev" != "null" ]; then
            echo "PREV_VERSION_ID=$prev" >> "$GITHUB_ENV"
            echo "จดเวอร์ชันก่อน deploy ไว้แล้ว: $prev"
          else
            echo "::warning::อ่านเวอร์ชันก่อน deploy ไม่ได้ — ถ้าขั้นยืนยันหลัง deploy ไม่ผ่านจะไม่ถอยอัตโนมัติ ต้องสั่ง rollback.yml เอง"
          fi

      # `npm run deploy` = opennextjs-cloudflare build && opennextjs-cloudflare deploy
      # ขั้น deploy จะ populateCache: คัดลอกแคชหน้า SSG เข้า static assets (`cdn-cgi/_next_cache`) ก่อน `wrangler deploy`
      # ⚠️ CLOUDFLARE_API_TOKEN ต้องมี Workers Scripts:Edit + Workers KV Storage:Edit
      #    ถ้าขาด ขั้น populateCache จะ fail แบบระบุชัดว่าขาดสิทธิ์อะไร
      - name: 🚀 Build & Deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # ชั้นสำรองที่ 3 ของคำอ่าน — โมเดลฟรีบน OpenRouter เท่านั้น (src/lib/ai/openrouter.ts)
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # ⚠️ เพิ่มผู้ให้บริการ AI รายใหม่ ต้องมาเติมชื่อคีย์ที่รายการนี้ด้วยเสมอ
          #    ขั้นนี้ส่งตัวแปรเข้า Worker แบบระบุรายชื่อทีละตัว ไม่ได้ส่งทั้งก้อน
          #    ลืมแล้ว = ต่อให้ตั้ง secret ไว้ Worker ก็ไม่มีวันเห็นคีย์ (INC-0152)
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID || vars.NEXT_PUBLIC_GA_ID || '' }}
          NEXT_PUBLIC_META_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_META_PIXEL_ID || vars.NEXT_PUBLIC_META_PIXEL_ID || '' }}
          NEXT_PUBLIC_GOOGLE_ADS_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_ADS_ID || vars.NEXT_PUBLIC_GOOGLE_ADS_ID || '' }}
          NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_LABEL: ${{ secrets.NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_LABEL || vars.NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_LABEL || '' }}
          NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT: ${{ secrets.NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT || vars.NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT || '' }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME || vars.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME || '' }}



      # ── 🩺 ยืนยันว่า Worker "รันได้จริง" หลัง deploy · ไม่ผ่านถอยกลับเวอร์ชันก่อนหน้าเอง (A10-02) ──
      # INC-0285: บิลด์และด่านทั้งชุดผ่านหมด แต่ทุกเส้นของ Next (/api/* · /readers · /admin) ตอบ 1101 บน production
      # 36 นาทีจนมีคนมาเห็นเอง เพราะพังเฉพาะตอนรันใน worker — ขั้นนี้ยิงเส้นที่ต้องผ่าน Worker จริงแทนการเช็กหน้าแรก
      # (หน้าแรกเป็นไฟล์ static ที่ขอบ ไม่ปลุก Worker) · รายละเอียดเส้นที่ยิงอยู่ใน `.github/scripts/worker-smoke.sh`
      # วางไว้ **ก่อน** ขั้น Stripe sync โดยตั้งใจ: ล้มแล้ว job หยุดตรงนี้ ไม่สร้างเวอร์ชันใหม่ทับเวอร์ชันที่เพิ่งถอย
      # ⚠️ การถอยไม่ย้อน migration ของ D1 (ดู rollback.yml) · ขั้นนี้ล้มเสมอเมื่อ smoke ไม่ผ่าน แม้ถอยสำเร็จ — ให้คนมาดูสาเหตุ
      - name: 🩺 ยืนยัน Worker หลัง deploy (ไม่ผ่าน = ถอยอัตโนมัติ)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if bash .github/scripts/worker-smoke.sh; then
            exit 0
          fi

          if [ -n "${PREV_VERSION_ID:-}" ]; then
            echo "::error::Worker ใหม่ไม่ผ่านด่านยืนยัน — กำลังถอยกลับเวอร์ชัน ${PREV_VERSION_ID}"
            npx wrangler rollback "$PREV_VERSION_ID" --message "auto-rollback: smoke ไม่ผ่านหลัง deploy ${GITHUB_SHA}" --yes || echo "::error::สั่งถอยไม่สำเร็จ — รัน rollback.yml ด้วยมือทันที"
            if bash .github/scripts/worker-smoke.sh; then
              echo "::error::ถอยกลับแล้ว Worker ตอบปกติ — โค้ดที่เพิ่ง deploy มีปัญหาตอนรันจริง ตรวจ log ก่อน deploy ซ้ำ"
            else
              echo "::error::ถอยกลับแล้วแต่ Worker ยังไม่ผ่าน — เข้า Cloudflare Dashboard ทันที"
            fi
          else
            echo "::error::Worker ใหม่ไม่ผ่านด่านยืนยัน และไม่มีเวอร์ชันก่อนหน้าให้ถอยอัตโนมัติ — สั่ง rollback.yml ด้วยมือทันที"
          fi
          exit 1

      # ── 💳 คีย์ Stripe: GitHub Secrets ➔ Worker secret ─────────────────────────────
      # เจ้าของเก็บคีย์ไว้ที่ GitHub (Settings ➔ Secrets and variables ➔ Actions) ไม่ได้รัน wrangler เอง
      # ขั้นนี้ดันเข้า Worker ด้วย `wrangler secret put` (อ่านจาก stdin — คีย์ไม่โผล่ใน log)
      # ไม่ได้ตั้งที่ GitHub = ข้าม ไม่แตะค่าที่อาจตั้งไว้ใน Cloudflare อยู่แล้ว
      # ⚠️ CLOUDFLARE_API_TOKEN ต้องมีสิทธิ์ Workers Scripts:Edit (ขั้น deploy ใช้อยู่แล้ว)
      - name: 💳 Sync Stripe secrets to Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          for name in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET; do
            if [ -z "${!name}" ]; then
              echo "ℹ️  ไม่ได้ตั้ง $name ใน GitHub Secrets — ข้าม"
              continue
            fi
            printf '%s' "${!name}" | npx wrangler secret put "$name"
            echo "✅ ตั้ง $name ใน Worker แล้ว"
          done

      # ── ล้างแคช Edge หลัง deploy (จำเป็นตั้งแต่เปิด Cache Rules เฟส 1) ──────────
      # Cache Rule `[phase1]` ตั้ง edge TTL หน้า SSG ไว้ 7 วัน ถ้าไม่ purge หลังปล่อยเวอร์ชันใหม่
      # ผู้ใช้จะยังเห็นหน้าเดิมค้างอยู่นานถึง 7 วัน (ของใหม่ขึ้นแล้วแต่ไม่มีใครเห็น)
      #
      # ⚠️ ขั้นนี้วางไว้ "หลัง" deploy เสมอ — ถ้า token ขาดสิทธิ์ "Zone · Cache Purge · Purge"
      #    โค้ดใหม่จะขึ้น production เรียบร้อยแล้ว เหลือแค่ job ขึ้นสีแดงเตือนให้ไปเติมสิทธิ์
      #    (เลือกให้ fail ดัง ๆ ดีกว่าปล่อยผ่านเงียบ ๆ แล้วเว็บค้างของเก่าโดยไม่มีใครรู้ — INC กันไว้ก่อน)
      - name: 🧹 Purge Cloudflare Edge Cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "::error::ไม่พบ secret CLOUDFLARE_ZONE_ID — เพิ่มที่ Settings ➔ Secrets ➔ Actions"
            echo "::error::หา zone id ได้ที่ Cloudflare Dashboard ➔ seertarot.net ➔ Overview (คอลัมน์ขวา)"
            exit 1
          fi

          RESPONSE=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')

          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q '"success":true'; then
            echo "✅ ล้างแคช Edge สำเร็จ — ผู้ใช้จะเห็นเวอร์ชันใหม่ทันที"
          else
            echo "::error::ล้างแคชไม่สำเร็จ — โค้ดใหม่ขึ้น production แล้ว แต่ Edge ยังเสิร์ฟของเก่าอยู่"
            echo "::error::เติมสิทธิ์ 'Zone · Cache Purge · Purge' ให้ CLOUDFLARE_API_TOKEN แล้ว re-run job นี้"
            exit 1
          fi

      # ── ดันกฎ "โฮสต์รอง ➔ โดเมนหลัก" ขึ้นชั้นขอบ แล้วยิงจริงเพื่อยืนยัน (INC-0203) ──────
      # กฎ www ➔ โดเมนหลักใน `next.config.ts` ครอบเฉพาะคำขอที่วิ่งถึง Worker
      # หน้าเนื้อหาที่ย้ายไป Astro ถูกตอบจากชั้น assets ก่อนถึง Worker กฎนั้นจึงเงียบไปเอง
      # โดยไม่มีอะไรพัง — เว็บถูกเสิร์ฟครบทั้งสองโฮสต์อยู่หลายวันกว่าจะมีคนยิง curl เจอ
      #
      # ขั้นนี้จึง "ดันกฎขึ้นขอบทุกครั้งที่ปล่อยเวอร์ชัน" แทนที่จะหวังว่าจะมีคนจำได้
      # ถ้า token ยังไม่มีสิทธิ์เขียน ruleset ก็ยังผ่านได้ถ้ากฎถูกตั้งไว้ด้วยมือแล้ว
      # (ตัดสินจาก "ของจริงเด้งหรือยัง" ไม่ใช่จาก "เขียนสำเร็จไหม")
      - name: 🌐 Canonical Host Redirect (www ➔ โดเมนหลัก)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if npm run cf:canonical-host; then
            echo "✅ กฎบนขอบเป็นปัจจุบันและยิงจริงแล้วเด้งถูกต้อง"
            exit 0
          fi

          echo "::warning::เขียนกฎขึ้นขอบไม่สำเร็จ — กำลังตรวจว่าของจริงเด้งอยู่แล้วหรือไม่"

          if npm run cf:canonical-host -- --check; then
            echo "::warning::กฎถูกตั้งไว้ด้วยมือแล้ว (ของจริงเด้ง 301 ครบ) แต่ token เขียน ruleset ไม่ได้"
            echo "::warning::เติมสิทธิ์ 'Zone · Single Redirect · Edit' ให้ CLOUDFLARE_API_TOKEN เพื่อให้ขั้นนี้ดูแลกฎเองได้"
            exit 0
          fi

          echo "::error::โฮสต์รองยังตอบ 200 = เว็บถูกจัดทำดัชนีสองโฮสต์ (น้ำหนัก SEO กระจาย · เปลือง crawl budget)"
          echo "::error::โค้ดใหม่ขึ้น production แล้ว ขั้นนี้แดงเพื่อเตือนเรื่องนี้อย่างเดียว"
          echo "::error::แก้ได้ 2 ทาง — (1) เติมสิทธิ์ 'Zone · Single Redirect · Edit' ให้ token แล้ว re-run"
          echo "::error::                (2) Cloudflare ➔ Rules ➔ Redirect Rules ➔ Create rule ตามที่สคริปต์พิมพ์ไว้ด้านบน"
          exit 1

      # ── ล้างแคชหน้า Next รุ่นเก่าที่ค้างใน KV (บิล KV Storage 14 GB · 2026-10-19) ──────
      # แคชหน้า Next ย้ายจาก KV ไป Workers Static Assets แล้ว (open-next.config.ts)
      # คีย์ `incremental-cache/<BUILD_ID>/…` ที่ deploy รุ่นก่อน ๆ seed ทิ้งไว้จึงไม่มีใครอ่านอีก
      # รอบแรกลบของสะสมทั้งหมด · รอบต่อไปเหลือ list ว่าง 1 ครั้ง (ไม่แตะคีย์ข้อมูลแอป `app:*`)
      # วางไว้ "หลัง" deploy เสมอ — Worker เวอร์ชันใหม่ต้องเลิกอ่าน KV ก่อนค่อยลบ
      # ล้มได้โดยไม่ทำให้ deploy แดง (โค้ดขึ้นแล้ว) แต่ขึ้นคำเตือนให้เห็น
      - name: 🧹 ล้างแคชหน้า Next เก่าใน KV
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:kv-prune
