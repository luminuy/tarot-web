name: 🚀 Production Deploy to Cloudflare Workers
run-name: "🚀 [By: ${{ github.actor }} | Branch: ${{ github.ref_name }}] ${{ github.event.head_commit.message || 'Deploy to Cloudflare Workers' }}"

on:
  push:
    branches:
      - main
  # จำเป็นต้องมี! GitHub จะไม่ trigger workflow จาก event ที่เกิดจาก GITHUB_TOKEN
  # (กันการวนซ้ำไม่รู้จบ) ดังนั้น PR ที่ถูก merge โดย pr.yml จะไม่ทำให้ deploy ทำงาน
  # pr.yml จึงต้องสั่ง dispatch มาที่นี่เองหลัง merge สำเร็จ
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  quality-check:
    name: 🧪 Quality & Integrity Checks
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dependencies
        run: npm install

      # ชุดตรวจกลาง 6 ด่าน — นิยามอยู่ที่ CHECKS ใน scripts/github-auto.ts
      # เพิ่มด่านตรวจใหม่ที่นั่นที่เดียว ทั้ง hooks / PR / Deploy จะตรวจเหมือนกันหมด
      - name: 🧪 Verification Suite (6 ด่าน)
        run: npm run repo:verify

  deploy:
    name: ⚡ Deploy to Cloudflare Workers
    needs: quality-check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dependencies
        run: npm install

      - name: 🚀 Build & Deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
