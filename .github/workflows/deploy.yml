name: 🚀 Production Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  quality-check:
    name: 🧪 Quality & Integrity Checks
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dependencies
        run: npm install

      - name: 🛡️ AI Multi-Agent Collision Check
        run: npm run agent:check

      - name: 🔍 TypeScript Typecheck
        run: npm run typecheck

      - name: 🃏 Verify 78 Cards Integrity
        run: ./node_modules/.bin/tsx scripts/verify-cards.ts

      - name: 📐 Verify 20 Spreads Geometry
        run: ./node_modules/.bin/tsx scripts/qa/test-spreads.ts

  deploy:
    name: ⚡ Deploy to Cloudflare Workers
    needs: quality-check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dependencies
        run: npm install

      - name: 🚀 Build & Deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
