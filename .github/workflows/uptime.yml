name: 🩺 Uptime — เช็กว่าเว็บล่มไหม
run-name: "🩺 Uptime ${{ github.event_name == 'workflow_dispatch' && format('(กดเองโดย {0})', github.actor) || '(ตามเวลา)' }}"

# ตัวเช็กเว็บล่ม (เจ้าของสั่ง 2026-10-19 · ผู้ช่วย cto/coo ไม่มีตัววัดเวลาล่มมาก่อน)
# ------------------------------------------------------------------------------
# ทุก 10 นาทียิง 4 จุด แต่ละจุดลองซ้ำได้ 3 ครั้ง (ห่าง 20 วินาที) ก่อนนับว่าล่ม
#   1. หน้าแรก `/`                    — หน้า Astro (ไฟล์นิ่ง)
#   2. `/readers`                     — หน้าที่ Worker เรนเดอร์ (ล่มพร้อม /api ใน INC-0285)
#   3. `POST /api/cron/daily-digest`  — API ของ Next ไม่แนบ Bearer ต้องได้ 401/403 (route fail-closed ตอบจากโค้ดจริง · ไม่ส่งอีเมล)
#      ใช้เส้น cron เพราะ `/api/*` อื่นบน workers.dev ถูกส่งกลับโดเมนหลักแล้ว (A10-07 · #706) · แบบเดียวกับ worker-smoke.sh
#   4. โดเมนหลัก seertarot.net        — DNS · โซน · ใบรับรอง (200 หรือ 403 หน้า challenge ถือว่าขอบยังอยู่)
#
# ⚠️ จุด 1–3 ยิงเข้า `*.workers.dev` ไม่ใช่ `seertarot.net` — เจตนา (ดู daily-digest.yml)
#    Bot Fight Mode ของโซนตอบหน้า challenge ให้ IP ของ GitHub runner จึงมองไม่เห็นว่า Worker ข้างในพังไหม
#    (Error 1101 ของ INC-0285 จะถูกบังด้วยหน้า challenge)
#
# ล่ม  ➔ เปิด issue ชื่อขึ้นต้น "[เว็บล่ม]" (มีอยู่แล้ว = ต่อคอมเมนต์ ไม่เปิดซ้ำ) — GitHub แจ้งเจ้าของรีโปทางอีเมล/แอป
# กลับมา ➔ คอมเมนต์เวลาที่กลับมาแล้วปิด issue · ผู้ช่วย cto/coo นับเหตุการณ์จาก issue เหล่านี้
#
# รีโปเป็น public — นาทีของ Actions ไม่เสียเงิน · cron ของ GitHub ดีเลย์ได้ 5–15 นาทีช่วงพีค

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: false

# 🔒 R-17: สิทธิ์แคบที่สุด — ไม่ checkout ไม่เขียนโค้ด ใช้แค่เปิด/ปิด issue
permissions:
  issues: write

jobs:
  probe:
    name: ยิงเช็ก 4 จุด
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: เช็กทุกจุด
        id: probe
        run: |
          WORKER="https://tarot-web.bankjack10452.workers.dev"
          UA="SeerTarot-Uptime/1.0"
          FAILS=""

          # $1 ชื่อ · $2 URL · $3 รหัสที่ยอมรับ (regex) · $4 ข้อความที่ต้องมีในเนื้อหา (ว่าง = ไม่ตรวจ) · $5 เมทอด (ค่าเริ่ม GET)
          check() {
            local name="$1" url="$2" ok="$3" must="$4" method="${5:-GET}" code="" i
            for i in 1 2 3; do
              code=$(curl -sS -o body.txt -w "%{http_code}" -X "$method" -A "$UA" --max-time 25 "$url" 2>/dev/null || echo "000")
              if [[ "$code" =~ ^($ok)$ ]] && { [ -z "$must" ] || grep -q "$must" body.txt; }; then
                echo "ปกติ  $name ($code)"
                return 0
              fi
              echo "ลองใหม่ $name ครั้งที่ $i ได้ $code"
              [ "$i" -lt 3 ] && sleep 20
            done
            FAILS="${FAILS}- ${name}: HTTP ${code} (${url})"$'\n'
          }

          check "หน้าแรก" "$WORKER/" "200" ""
          check "หน้ารวมแม่หมอ (Worker เรนเดอร์)" "$WORKER/readers" "200" ""
          check "API (Next · ไม่มีรหัสต้องถูกปฏิเสธ)" "$WORKER/api/cron/daily-digest" "401|403" "" "POST"
          check "โดเมนหลัก seertarot.net" "https://seertarot.net/" "200|403" ""

          {
            echo "fails<<EOF"
            printf "%s" "$FAILS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: เปิด/ต่อ/ปิด issue เว็บล่ม
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          FAILS: ${{ steps.probe.outputs.fails }}
        run: |
          NOW=$(TZ=Asia/Bangkok date '+%Y-%m-%d %H:%M น. (เวลาไทย)')
          OPEN=$(gh issue list --state open --search "in:title [เว็บล่ม]" --json number --jq '.[0].number // empty')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ -n "$FAILS" ]; then
            BODY=$(printf "พบจุดที่ไม่ตอบเมื่อ %s\n\n%s\nรอบที่ตรวจ: %s\n\nวิธีไล่ปัญหา: docs/INCIDENT_LOG.md (INC-0285 · Error 1101) · ถอยรุ่นด้วย workflow rollback.yml\n\n---\n_ตัวเช็กเว็บล่มอัตโนมัติ (.github/workflows/uptime.yml)_" "$NOW" "$FAILS" "$RUN_URL")
            if [ -n "$OPEN" ]; then
              gh issue comment "$OPEN" --body "$BODY"
            else
              gh issue create --title "[เว็บล่ม] พบจุดที่ไม่ตอบ $NOW" --body "$BODY"
            fi
            echo "::error::เว็บมีจุดที่ไม่ตอบ"
            printf "%s" "$FAILS"
            exit 1
          fi

          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "กลับมาตอบปกติครบทุกจุดเมื่อ $NOW · รอบที่ตรวจ: $RUN_URL"
            gh issue close "$OPEN" --reason completed
          fi
          echo "ปกติครบทุกจุด"
