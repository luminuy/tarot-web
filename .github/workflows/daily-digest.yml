name: 📬 Daily Digest — ส่งดวงประจำวันทางอีเมล
run-name: "📬 Daily Digest ${{ github.event_name == 'workflow_dispatch' && format('(กดเองโดย {0})', github.actor) || '(ตามเวลา)' }}"

# ตัวจับเวลาของ Daily Digest
# ------------------------------------------------------------------------------
# ทำไมไม่ใช้ Cloudflare Cron Trigger:
# `wrangler.jsonc` ชี้ `main` ไปที่ `.open-next/worker.js` ซึ่ง OpenNext สร้างใหม่ทุกครั้งที่
# build และ export แค่ `fetch` — การใส่ `scheduled` handler ต้องเขียน wrapper ครอบไฟล์ที่
# deploy pipeline ทั้งสายพึ่งอยู่ ความเสี่ยงไม่คุ้มกับงานส่งอีเมลวันละครั้ง
#
# ⚠️ cron ของ GitHub เป็น **UTC เสมอ** และดีเลย์ได้ 5–15 นาทีช่วงพีค
# ยอมรับได้กับ digest รายวัน — ห้ามเอาแพตเทิร์นนี้ไปใช้กับงานที่ต้องตรงเวลาเป๊ะ
#
# ปลายทางกันซ้ำอยู่แล้วที่ฝั่งเซิร์ฟเวอร์ (PRIMARY KEY ของ `digest_log`)
# กดรันเองซ้ำกี่ครั้งในวันเดียวกันก็ไม่มีใครได้อีเมลซ้ำ

on:
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC = 08:00 น. เวลาไทย
  workflow_dispatch: # ให้กดยิงเองได้ตอนทดสอบหรือตอนรอบที่แล้วล้ม

concurrency:
  group: daily-digest
  cancel-in-progress: false

# 🔒 R-17: สิทธิ์แคบที่สุดเท่าที่งานนี้ใช้จริง
# งานนี้ไม่ checkout ไม่เขียนอะไรกลับเข้ารีโปเลย ยิง HTTP เส้นเดียวแล้วจบ
# จึงไม่ต้องการสิทธิ์ใด ๆ ทั้งสิ้น — ปล่อยว่างไว้แปลว่าได้สิทธิ์ดีฟอลต์ของรีโป
# ซึ่งอาจเป็น `contents: write` ได้ทั้งก้อนโดยไม่มีใครตั้งใจ
permissions: {}

jobs:
  send:
    name: ส่งดวงประจำวัน
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ไม่ต้อง checkout และไม่ต้อง setup-node — งานนี้แค่ยิง HTTP เส้นเดียว
      - name: ยิงเส้น cron ของ digest
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::ยังไม่ได้ตั้ง repository secret ชื่อ CRON_SECRET — เส้น API จะตอบ 401 ทุกครั้ง"
            exit 1
          fi

          echo "กำลังยิง POST /api/cron/daily-digest ..."

          # ⚠️ ยิงเข้า `*.workers.dev` ไม่ใช่ `seertarot.net` — เจตนา ห้ามเปลี่ยนกลับ
          # โดเมนหลักเปิด **Bot Fight Mode** อยู่ ซึ่งตอบ managed challenge
          # (หน้า "Just a moment..." ที่ต้องมี JavaScript + คุกกี้) ให้กับคำขอที่มาจาก
          # IP ของดาต้าเซ็นเตอร์ — IP ของ GitHub runner เข้าข่ายเต็ม ๆ
          # cron จึงได้ 403 ทุกครั้งไม่ว่าจะตั้ง User-Agent อะไร และไม่ว่าความลับถูกหรือผิด
          # (พิสูจน์แล้วในรอบ #450: เปลี่ยน UA อย่างเดียวไม่พอ ยังโดน challenge เหมือนเดิม)
          #
          # `*.workers.dev` เป็นโดเมนของ Cloudflare เอง ไม่ได้อยู่ในโซน `seertarot.net`
          # การตั้งค่าระดับโซน (Bot Fight Mode · WAF custom rules) จึงไม่มีผลกับเส้นนี้
          # โค้ดที่รันคือ Worker ตัวเดียวกันเป๊ะ และลิงก์ในอีเมลยังชี้ `seertarot.net`
          # เพราะสร้างจาก SITE_ORIGIN ในโค้ด ไม่ได้เอามาจาก host ของคำขอ
          #
          # 🔒 เส้นนี้ยังปลอดภัย: `/api/cron/daily-digest` เป็น fail-closed
          # ไม่มี Bearer ที่ตรงกับ CRON_SECRET = 401 เปล่า ๆ เสมอ
          #
          # ⚠️ ถ้าวันหน้าเปลี่ยนชื่อบัญชี Cloudflare หรือปิด workers.dev route ต้องแก้ที่นี่
          # (URL ตัวจริงพิมพ์อยู่ท้าย log ของ workflow deploy ทุกครั้ง)
          #
          # ยังคงตั้ง User-Agent เองไว้เป็นชั้นกันเหนียว — กฎ WAF ข้อ 5 บล็อก curl ที่ /api/
          HTTP_CODE=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "https://tarot-web.bankjack10452.workers.dev/api/cron/daily-digest" \
            -A "SeerTarot-Cron/1.0" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 300)

          echo "HTTP $HTTP_CODE"
          echo "--- ผลลัพธ์ ---"
          cat response.json || true
          echo ""

          if [ "$HTTP_CODE" = "403" ]; then
            echo "::error::โดน 403 — คำขอถูกปัดตกที่ชั้น edge ก่อนถึง Worker (ไม่ใช่เรื่องความลับผิด)"
            echo "::error::ถ้าผลลัพธ์ด้านบนเป็นหน้า 'Just a moment...' = โดน Bot Fight Mode ของโซน"
            echo "::error::เส้นนี้ควรยิงเข้า *.workers.dev ซึ่งไม่อยู่ในโซน — ตรวจว่า URL ด้านบนไม่ได้ถูกเปลี่ยนกลับเป็น seertarot.net"
            exit 1
          fi

          if [ "$HTTP_CODE" = "401" ]; then
            echo "::error::โดน 401 — ค่า CRON_SECRET ฝั่ง GitHub กับฝั่ง Cloudflare ไม่ตรงกัน (หรือฝั่ง Worker ยังไม่ได้ตั้ง)"
            echo "::error::ตั้งด้วย: npx wrangler secret put CRON_SECRET แล้วใส่ค่าเดียวกันใน repository secret"
            exit 1
          fi

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::รอบนี้ล้มเหลว (HTTP $HTTP_CODE) — ดูรายละเอียดในผลลัพธ์ด้านบน"
            exit 1
          fi
