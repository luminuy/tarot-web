name: 🧹 Take preview down (ลบ Worker ลิงก์ทดลอง tarot-web-preview)
run-name: "🧹 Remove tarot-web-preview"

# ─────────────────────────────────────────────────────────────────────────────
# ลบ Worker ลิงก์ทดลอง `tarot-web-preview` (สร้างโดย preview.yml) ออกจาก Cloudflare
# เจ้าของสั่ง 2026-10-17: "deploy ขึ้นเว็บจริง และเอา web preview ลงได้"
#
# ⚠️ ลบเฉพาะ Worker ชื่อ `tarot-web-preview` — Worker `tarot-web` (seertarot.net) ไม่ถูกแตะ
#    ชื่อเขียนตายตัวในคำสั่ง ไม่รับจากอินพุต (กันพิมพ์ผิดไปลบ production)
# ⚠️ binding (D1/KV/R2) เป็นของกลางกับ production — `wrangler delete` ลบแค่ตัว Worker ไม่ลบ resource ที่ผูก
# วิธีสั่ง: แท็บ Actions ➔ เลือก workflow นี้ ➔ Run workflow · อยากได้ลิงก์ทดลองคืน = push คอมมิตที่มี `[preview]` ใหม่
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  down:
    name: 🧹 Delete tarot-web-preview Worker
    runs-on: ubuntu-latest
    steps:
      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: 🧹 wrangler delete --name tarot-web-preview
        run: npx --yes wrangler@4 delete --name tarot-web-preview --force
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
