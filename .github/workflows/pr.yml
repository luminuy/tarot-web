name: 🔍 PR Automated Verification, Review & Auto-Merge
run-name: "🔍 [PR #${{ github.event.pull_request.number }} | By: ${{ github.actor }}] ${{ github.event.pull_request.title }}"

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write
  checks: write
  actions: write   # ต้องมีเพื่อสั่ง dispatch deploy.yml หลัง merge สำเร็จ

jobs:
  pr-verification:
    name: 🧪 Automated Verification & Quality Audit
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: ⚡ Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # ⚠️ ต้องปิดไว้เสมอ — setup-node@v5 เปิดแคชของ package manager ให้เองโดยอัตโนมัติ
          # (v4 ไม่เปิดถ้าไม่ได้ใส่ `cache:`) มันอ่าน `packageManager: pnpm@9.15.4` ใน package.json
          # แล้วมองหา `pnpm-lock.yaml` ซึ่ง repo นี้ไม่มี (ใช้ `pnpm install --no-frozen-lockfile`)
          # ผลคือ workflow ล้มทันทีด้วย "Dependencies lock file is not found" (บทเรียน INC หลัง PR #234)
          package-manager-cache: false

      - name: 📦 Install dependencies
        run: pnpm install --no-frozen-lockfile

      # ชุดตรวจกลางทั้งหมด — นิยามอยู่ที่ CHECKS ใน scripts/github-auto.ts ที่เดียว
      # (แหล่งความจริงเดียวร่วมกับ git hooks และ npm run commit · เพิ่มด่านใหม่ให้ไปเพิ่มที่นั่น)
      #
      # ⚠️ ห้ามเขียนจำนวนด่านหรือจำนวนผังลงในชื่อขั้นตอนและคอมเมนต์ตรงนี้อีก
      # ของเดิมเขียนตัวเลขไว้ตั้งแต่ยุคแรกสุดของโปรเจกต์ แล้วไม่มีใครตามแก้เลย
      # ตลอดหลายสิบด่านที่เพิ่มเข้ามาทีหลัง — ตัวเลขที่ไม่มีเครื่องตรวจจะเพี้ยนเสมอ
      # ตอนนี้ด่าน test-docs-numbers ส่องไฟล์ workflow ด้วยแล้ว แต่ทางที่ปลอดภัยกว่า
      # คือไม่เขียนตัวเลขลงที่นี่ตั้งแต่แรก เพราะแหล่งความจริงอยู่ที่ CHECKS อยู่แล้ว
      - name: 🧪 Verification Suite
        id: verify
        run: pnpm run repo:verify
        # ⚠️ ต้องมีที่นี่ด้วย ไม่ใช่แค่ตอน deploy — `repo:verify` มีด่านที่ build เว็บเองเมื่อยังไม่มี
        # `.next/` (test-en-routing.ts) แล้วด่านภาพแชร์ (test-og-images.ts) ก็อ่านผลนั้นต่อ
        # `NEXT_PUBLIC_*` ถูกฝังตอน build เท่านั้น ถ้าขั้นนี้ build โดยไม่มีค่าเดียวกับตอน deploy
        # CI จะไปตรวจอาร์ติแฟกต์คนละก้อนกับที่ขึ้น production
        # (เกิดขึ้นจริงหลัง PR #348 — deploy ของ main ล้มด้วย "พบ 1 ค่า")
        env:
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID || vars.NEXT_PUBLIC_GA_ID || '' }}
          NEXT_PUBLIC_META_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_META_PIXEL_ID || vars.NEXT_PUBLIC_META_PIXEL_ID || '' }}
          NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT: ${{ secrets.NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT || vars.NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT || '' }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME || vars.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME || '' }}

      - name: ⚡ Test Build Worker & Next.js Bundle
        id: build_check
        run: pnpm run build
        # build ทดสอบต้องใช้ env ชุดเดียวกับตอน deploy จะได้เจอปัญหาตั้งแต่ตอนยังเป็น PR
        # ไม่ใช่ไปโผล่ตอน deploy ขึ้น production แล้ว (บทเรียนจาก PR #348)
        env:
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID || vars.NEXT_PUBLIC_GA_ID || '' }}
          NEXT_PUBLIC_META_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_META_PIXEL_ID || vars.NEXT_PUBLIC_META_PIXEL_ID || '' }}
          NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT: ${{ secrets.NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT || vars.NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT || '' }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME || vars.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME || '' }}

      - name: 🏷️ Auto-Label PR Based on Modified Files
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            const labels = new Set();
            for (const file of files) {
              const filename = file.filename;
              if (filename.startsWith('src/components/')) labels.add('✨ UI/UX');
              if (filename.startsWith('src/data/cards') || filename.includes('cards')) labels.add('🃏 Tarot Cards');
              if (filename.startsWith('src/data/spreads') || filename.includes('spreads')) labels.add('📐 Spreads');
              if (filename.startsWith('.github/') || filename.includes('wrangler')) labels.add('⚙️ CI/CD & Cloudflare');
              if (filename.startsWith('scripts/agent') || filename.includes('locks')) labels.add('🛡️ AI Agent Guard');
              if (filename.startsWith('docs/')) labels.add('📚 Documentation');
            }
            
            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: Array.from(labels)
              });
            }

      - name: 📝 Post Automated Verification Review Comment
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const author = pr ? pr.user.login : context.actor;
            const headBranch = pr ? pr.head.ref : 'unknown';
            const baseBranch = pr ? pr.base.ref : 'main';
            const shaShort = context.sha.slice(0, 7);

            const body = `### 🔮 รายงานตรวจสอบคุณภาพและการส่งต่องาน (Provenance & Quality Audit) ✦
            
            > 👤 **ผู้ดำเนินการ / ผู้แก้ไข (Author)**: \`@${author}\`  
            > 🌿 **กิ่งต้นทาง (Source)**: \`${headBranch}\` ➔ 🎯 **กิ่งเป้าหมาย (Target)**: \`${baseBranch}\`  
            > 🆔 **Commit SHA**: \`${shaShort}\` | ⚡ **Deploy Target**: \`Cloudflare Workers Edge\`
            
            | การตรวจสอบระบบ | ผลลัพธ์ | รายละเอียดการรับรอง |
            | :--- | :---: | :--- |
            | 🛡️ **AI Agent Collision Guard** | ✅ ผ่าน | ไม่พบการชนกันของไฟล์หรือ Lock ที่ใช้งานอยู่ |
            | 🔍 **TypeScript Strict Typecheck** | ✅ ผ่าน | 0 Errors (ความปลอดภัย Type 100%) |
            | 🃏 **78 Rider-Waite Cards Integrity** | ✅ ผ่าน | ครบ 78 ใบ (780 ข้อความความหมาย 5 มิติ) |
            | 📐 **25 Spreads Geometry Calibration** | ✅ ผ่าน | ทุกตำแหน่งไม่ทับกัน (ผังสัดส่วนทองคำ) |
            | ⚡ **Next.js & OpenNext Bundle Build** | ✅ ผ่าน | พร้อม Deploy สู่ Cloudflare Workers ทันที |
            
            ✨ **ระบบตรวจสอบและอนุมัติให้อัตโนมัติ (Auto-Verified & Auto-Merged)** 🚀`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

  # ─────────────────────────────────────────────────────────────────────────
  # ⚠️ ต้องเป็น job แยก ห้ามย้ายกลับไปรวมกับ pr-verification เด็ดขาด
  # ตั้งแต่ 2026-09-07 `🧪 Automated Verification & Quality Audit` เป็น
  # **required status check** ของ branch protection บน main
  # ถ้าขั้นตอน merge อยู่ใน job เดียวกัน มันจะสั่ง merge ตอนที่ตัวเองยัง in_progress
  # GitHub จึงปฏิเสธด้วย "Required status check ... is expected" -> core.setFailed
  # -> ด่านกลายเป็น FAILURE -> PR merge ไม่ได้ตลอดกาล (deadlock ที่เกิดจริงกับ PR #355)
  # แยกเป็น job ที่ `needs: pr-verification` ด่านจึงจบเขียวก่อน แล้วค่อย merge ได้
  # ─────────────────────────────────────────────────────────────────────────
  auto-merge:
    name: 🔀 Auto-Merge & Deploy Dispatch
    runs-on: ubuntu-latest
    needs: pr-verification
    if: github.event.pull_request.draft == false
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: 🔀 Auto-Merge Verified PR into main
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              console.log('ℹ️ ไม่ใช่ pull_request event — ข้าม auto-merge');
              return;
            }

            // Perform automated squash merge
            // ⚠️ ลองซ้ำได้ 5 ครั้ง ห่างกัน 10 วิ — หลังจาก job ตรวจจบ GitHub ใช้เวลาสักครู่
            // กว่าจะบันทึกผล required status check ให้ mergeable_state อัปเดตตาม
            // ถ้ายิง merge จังหวะนั้นพอดีจะโดนปฏิเสธด้วย "Required status check ... is expected"
            // ทั้งที่ด่านผ่านแล้ว
            let merged = false;
            let lastErr = null;
            for (let attempt = 1; attempt <= 5 && !merged; attempt++) {
              try {
                const mergeRes = await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  merge_method: 'squash',
                  commit_title: `${pr.title} (#${pr.number})`
                });
                merged = mergeRes.data.merged;
                console.log('✨ Auto-Merge Successful:', mergeRes.data.message);
              } catch (err) {
                lastErr = err;
                console.log(`ℹ️ ครั้งที่ ${attempt}/5 ยัง merge ไม่ได้:`, err.message);
                const prCheck = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number
                });
                if (prCheck.data.merged) {
                  merged = true;
                  console.log('✨ PR is already MERGED!');
                } else if (attempt < 5) {
                  await new Promise((r) => setTimeout(r, 10000));
                }
              }
            }
            if (!merged) {
              core.setFailed(`Auto-merge failed: ${lastErr ? lastErr.message : 'unknown'}`);
              return;
            }

            if (!merged) return;

            // Dispatch production deploy to Cloudflare Workers (Hard-fail if dispatch fails)
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'deploy.yml',
                ref: 'main'
              });
              console.log('🚀 สั่ง deploy.yml ให้ deploy main ขึ้น Cloudflare Workers แล้ว');
            } catch (err) {
              console.log('❌ สั่ง deploy ไม่สำเร็จ:', err.message);
              core.setFailed(`Merge สำเร็จแต่สั่ง deploy.yml ไม่ได้: ${err.message}`);
            }

            // ลบ branch ที่ merge แล้วทิ้ง
            try {
              const headRef = context.payload.pull_request.head.ref;
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${headRef}`
              });
              console.log(`🧹 ลบ branch ${headRef} บน remote เรียบร้อย`);
            } catch (err) {
              console.log('ℹ️ ลบ branch ไม่ได้ (อาจถูกลบไปแล้ว):', err.message);
            }
